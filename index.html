<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carga semanal · Planificación</title>
<meta name="description" content="Carga de la planificación semanal y del cumplimiento de tareas.">
<meta name="theme-color" content="#4B5557">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carga semanal">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
  /* Botón "Página de Inicio" centrado en la barra superior (lo dibuja app.js) */
  .barra { position: relative; }
  .btn-inicio {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: inline-flex;
    align-items: center;
    gap: .45em;
    padding: .5em 1.1em;
    border: 1.5px solid rgba(255, 255, 255, .85);
    border-radius: 8px;
    background: transparent;
    color: #fff;
    font: 600 15px/1.2 "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    z-index: 2;
  }
  .btn-inicio:hover { background: #fff; color: #4B5557; }
  .btn-inicio:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .btn-inicio svg { width: 1.1em; height: 1.1em; flex: none; }

  /* En pantallas angostas deja de flotar en el centro para no tapar el título ni el menú */
  @media (max-width: 1000px) {
    .btn-inicio {
      position: static;
      transform: none;
      margin: .4em 0;
    }
  }
</style>
</head>
<body>
<div id="app" aria-live="polite"><p class="cargando">Cargando…</p></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript>Esta aplicación necesita JavaScript activado.</noscript>
<script src="/app.js" defer></script>
</body>
</html>
